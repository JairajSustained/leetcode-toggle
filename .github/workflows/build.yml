name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .app + .dmg
        run: ./build.sh

      - name: Verify bundle
        run: |
          codesign --verify --verbose dist/LeetCodeToggle.app
          lipo -info dist/LeetCodeToggle.app/Contents/MacOS/LeetCodeToggle
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" dist/LeetCodeToggle.app/Contents/Info.plist

      # --- Optional: Developer ID signing + notarization -------------------
      # Note: the `secrets` context can't be used in step `if:` conditions,
      # so this step is always run and no-ops when no credentials are set.
      #
      # To enable, add these to the repo's Settings → Secrets and variables
      # → Actions (requires a paid Apple Developer account):
      #   APPLE_CERTIFICATE          base64 of your "Developer ID Application" .p12
      #   APPLE_CERTIFICATE_PASSWORD password of that .p12
      #   APPLE_ID                   your Apple ID email
      #   APPLE_APP_PASSWORD         an app-specific password
      #   APPLE_TEAM_ID              your 10-character Apple Team ID
      # Optional variable (Settings → Variables):
      #   APPLE_SIGNING_IDENTITY     exact certificate name, e.g.
      #                              "Developer ID Application: Name (TEAMID)"
      - name: Sign with Developer ID + notarize (skipped without credentials)
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret set — shipping the ad-hoc signed build."
            exit 0
          fi

          # Import the signing certificate
          echo "$CERTIFICATE" | base64 --decode > signing.p12
          security create-keychain -p "build" build.keychain
          security import signing.p12 -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -A -k build.keychain
          security set-keychain-settings -lut 7200 build.keychain
          security list-keychain -d user -s build.keychain
          rm signing.p12

          # Sign with hardened runtime
          : "${SIGN_IDENTITY:=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')}"
          echo "Signing identity: $SIGN_IDENTITY"
          codesign --force --deep --options runtime \
            --sign "$SIGN_IDENTITY" \
            --timestamp https://timestamp.apple.com/ts01 \
            dist/LeetCodeToggle.app
          codesign --verify --verbose dist/LeetCodeToggle.app

          # Notarize + staple
          ditto -c -k --keepParent dist/LeetCodeToggle.app LeetCodeToggle.app.zip
          xcrun notarytool submit LeetCodeToggle.app.zip \
            --apple-id "$APPLE_ID" \
            --app-password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple dist/LeetCodeToggle.app
          rm LeetCodeToggle.app.zip

          # Rebuild the .dmg so it contains the signed + stapled app
          STAGE=dmg-staging
          rm -rf "$STAGE" dist/LeetCodeToggle.dmg
          mkdir -p "$STAGE"
          cp -R dist/LeetCodeToggle.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "LeetCode Toggle" -srcfolder "$STAGE" \
            -ov -format UDZO dist/LeetCodeToggle.dmg
          rm -rf "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeetCodeToggle
          path: dist/LeetCodeToggle.dmg

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LeetCodeToggle.dmg
          generate_release_notes: true
