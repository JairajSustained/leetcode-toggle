name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build .app bundle
        run: ./build.sh

      - name: Verify bundle
        run: |
          codesign --verify --verbose dist/LeetCodeToggle.app
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" dist/LeetCodeToggle.app/Contents/Info.plist

      - name: Package for download
        run: |
          ditto -c -k --keepParent dist/LeetCodeToggle.app LeetCodeToggle.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeetCodeToggle
          path: LeetCodeToggle.app.zip

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LeetCodeToggle.app.zip
          generate_release_notes: true
